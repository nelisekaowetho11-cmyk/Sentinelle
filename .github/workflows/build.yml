name: PRIME NET VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRIME NET VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Repair Android strings and validate XML
        working-directory: clients/sentinelle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          strings_file = Path(
              "android/app/src/main/res/values/veil_strings.xml"
          )

          if not strings_file.is_file():
              raise SystemExit(f"Missing file: {strings_file}")

          strings_file.write_text(
              "<resources>\n"
              '    <string name="widget_description">Connect or disconnect PrimeNet VPN with one tap.</string>\n'
              '    <string name="tile_label">PrimeNet VPN</string>\n'
              "</resources>\n",
              encoding="utf-8"
          )

          print("Android app strings repaired.")

          resource_dir = Path("android/app/src/main/res")
          xml_files = list(resource_dir.rglob("*.xml"))

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.is_file():
              xml_files.append(manifest)

          failed = False

          for xml_file in sorted(set(xml_files)):
              try:
                  ET.parse(xml_file)
                  print(f"XML OK: {xml_file}")
              except ET.ParseError as error:
                  print(f"XML ERROR: {xml_file}: {error}")
                  failed = True

          if failed:
              raise SystemExit("Android XML validation failed.")

          print("All Android XML files passed validation.")
          PY

      - name: Install Flutter dependencies
        working-directory: clients/sentinelle
        run: flutter pub get

      - name: Build release APK
        working-directory: clients/sentinelle
        run: flutter build apk --release --flavor sideload

      - name: Verify APK exists
        run: |
          test -f clients/sentinelle/build/app/outputs/flutter-apk/app-sideload-release.apk
          ls -lh clients/sentinelle/build/app/outputs/flutter-apk/app-sideload-release.apk

      - name: Upload PRIME NET VPN APK
        uses: actions/upload-artifact@v7
        with:
          name: PRIME-NET-VPN
          path: clients/sentinelle/build/app/outputs/flutter-apk/app-sideload-release.apk
          if-no-files-found: error
          retention-days: 7
