
name: Build PRIME NET VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Force Flutter to use Java 17
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter doctor -v

      - name: Install dependencies
        working-directory: clients/sentinelle
        run: flutter pub get

      - name: Build PRIME NET VPN
        working-directory: clients/sentinelle
        run: flutter build apk --release --flavor sideload

      - name: Upload PRIME NET VPN APK
        uses: actions/upload-artifact@v7
        with:
          name: PRIME-NET-VPN
          path: clients/sentinelle/build/app/outputs/flutter-apk/app-sideload-release.apk
          if-no-files-found: error
