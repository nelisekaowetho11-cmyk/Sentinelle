
name: Build PRIME NET VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Java version
        run: java -version

      - name: Install dependencies
        working-directory: clients/sentinelle
        run: flutter pub get

      - name: Build APK
        working-directory: clients/sentinelle
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-NET-VPN
          path: clients/sentinelle/build/app/outputs/flutter-apk/app-release.apk
