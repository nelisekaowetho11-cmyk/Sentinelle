name: Android client (sideload)

# Builds the sideload APK — the one handed out from the panel, which updates
# itself. The Play bundle is deliberately not built here: it needs the upload
# keystore, and Play's own console is the only place it goes.
#
# ── READ THIS BEFORE TRUSTING AN APK FROM THIS WORKFLOW ──────────────────────
#
# The sideload flavour signs with Gradle's *debug* config, which reads
# ~/.android/debug.keystore — and generates a fresh one when it is missing,
# which is exactly what a clean runner is. An APK signed with a newly minted
# key installs fine on a clean phone and then fails on every phone that already
# has the app: Android refuses an update whose certificate differs, so the user
# sees "App not installed" and the only way out is uninstalling, which loses
# their accounts.
#
# So the real keystore has to be restored from a secret, and the certificate is
# checked against a known fingerprint afterwards. Without both, this workflow
# still builds — a compile check is worth having — but it labels what it
# produces UNSIGNED-FOR-RELEASE so nobody hands it out by accident.
#
# Secrets and variables:
#   secrets.ANDROID_DEBUG_KEYSTORE_B64  base64 of ~/.android/debug.keystore
#   vars.ANDROID_SIGNING_SHA256         expected certificate SHA-256

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'clients/sentinelle/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/sentinelle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # Restored before the build, because Gradle creates its own the moment it
      # finds none and then everything downstream is quietly wrong.
      - name: Restore the signing key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set. The APK will be signed with a throwaway key and cannot update any existing install."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.android
          # Whitespace-tolerant, and armour-tolerant. The value is pasted by
          # hand into the GitHub UI: `base64 -d` rejects a carriage return from
          # a Windows clipboard, and `certutil -encode` wraps its output in
          # -----BEGIN CERTIFICATE----- lines that are not base64 either.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | sed 's/-----[A-Za-z ]*-----//g' | tr -d '\r\n \t')

          # Said out loud before decoding, because "invalid input" on its own
          # gives nothing to act on and the value cannot be printed. None of
          # this reveals the secret — only its shape.
          LEN=${#CLEAN}
          BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "length after cleaning: $LEN  (a 2618-byte keystore encodes to 3492)"
          echo "length mod 4: $((LEN % 4))  — anything but 0 means a truncated paste"
          echo "characters outside the base64 alphabet: $BAD"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::The secret is not base64. Set it with: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"\$env:USERPROFILE\\.android\\debug.keystore\")) | Set-Clipboard"
            exit 1
          fi

          printf '%s' "$CLEAN" | base64 -d > ~/.android/debug.keystore

          # Decoding to something that is not a keystore is worse than failing
          # to decode at all: Gradle would quietly create its own and sign with
          # a key nobody's phone accepts. Both formats are legitimate — Android
          # Studio wrote JKS (feedfeed) for years and PKCS12 (3082) since.
          MAGIC=$(head -c 4 ~/.android/debug.keystore | od -A n -t x1 | tr -d ' \n')
          case "$MAGIC" in
            feedfeed*|3082*) ;;
            *)
              echo "::error::The secret did not decode into a keystore (starts with '$MAGIC'). Re-copy it — see the header of this workflow for the command."
              exit 1
              ;;
          esac

          # A paste that was cut short decodes cleanly and even keeps the right
          # first four bytes, so the check above waves it through. Opening the
          # keystore is the only thing that reads far enough to notice.
          if ! keytool -list -keystore ~/.android/debug.keystore \
                 -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::The keystore decoded but will not open. Usually a truncated paste — compare the length above against what the copy command reports."
            exit 1
          fi

          # AGP looks in $ANDROID_SDK_HOME/.android before it falls back to the
          # home directory, and some runner images set that variable. When they
          # do, the keystore restored above is never opened: Gradle finds none
          # where it looked, silently mints a fresh one, and the APK comes out
          # signed by a key no installed copy of the app will accept. Pinning it
          # to $HOME makes both paths the same directory.
          echo "ANDROID_SDK_HOME=$HOME" >> "$GITHUB_ENV"

          # Said now, while the only thing that could be wrong is the secret.
          # After the build, a mismatch could equally mean Gradle ignored this
          # file — and those two need different fixes.
          # `-v`, because plain `-list` labels it "Certificate fingerprint
          # (SHA-256)" while the verbose form says "SHA256:" — and the colon
          # inside the plain label is what makes a naive cut lose the value.
          RESTORED=$(keytool -list -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey 2>/dev/null |
            grep -i '^[[:space:]]*SHA256:' | head -1 |
            sed 's/.*SHA256:[[:space:]]*//' | tr -d ': \r' | tr 'a-f' 'A-F')
          echo "restored keystore certificate: $RESTORED"
          EXPECTED_CLEAN=$(echo "${{ vars.ANDROID_SIGNING_SHA256 }}" | tr -d ': ' | tr 'a-f' 'A-F')
          if [ -n "$EXPECTED_CLEAN" ] && [ "$RESTORED" != "$EXPECTED_CLEAN" ]; then
            echo "::error::The secret holds a different keystore than the one ANDROID_SIGNING_SHA256 describes. Re-copy from the machine that has published builds before."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags e2e

      - name: Build
        run: flutter build apk --release --flavor sideload

      # The one check that catches the failure this workflow is most likely to
      # cause, and the only one that cannot be caught by installing on a clean
      # phone — which is what testing an APK usually means.
      - name: Verify the signing certificate
        env:
          EXPECTED: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-sideload-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" |
            grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          echo "signing certificate SHA-256: $FINGERPRINT"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::vars.ANDROID_SIGNING_SHA256 is not set, so nothing was compared. Set it to the fingerprint above once you have confirmed it is the right one."
            exit 0
          fi
          if [ "$FINGERPRINT" != "$(echo "$EXPECTED" | tr -d ': ' | tr 'a-f' 'A-F')" ]; then
            echo "::error::Signed with the wrong key. This APK would fail to install over any existing copy of the app."
            exit 1
          fi
          echo "matches the expected certificate."

      - name: Package
        id: package
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Named the way the published builds are, except when it is signed
          # with a throwaway key — then the name says so, because the file
          # outlives the log that explained it.
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            NAME="Sentinelle-sideload-release-$VERSION.apk"
          else
            NAME="Sentinelle-sideload-UNSIGNED-FOR-RELEASE-$VERSION.apk"
          fi
          cp build/app/outputs/flutter-apk/app-sideload-release.apk "dist/$NAME"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sentinelle-android-${{ steps.package.outputs.version }}
          path: clients/sentinelle/dist/*
          if-no-files-found: error

      - name: Release
        # Tags only, and only when it carries the real signature — an APK the
        # existing install base cannot accept must never reach a release page.
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: clients/sentinelle/dist/*
          body: |
            Android build of the Sentinelle client, sideload flavour — installed
            from the file rather than a store, and updates itself from your
            provider's panel.

            Android will ask once for permission to install from this source.
