name: Linux client

# Builds the Linux desktop client and packages it two ways: a .tar.gz that runs
# from anywhere, and a .deb for Debian and Ubuntu.
#
# Run it from the Actions tab, or push a tag like v1.7.4 for a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'clients/sentinelle/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: write

jobs:
  build:
    # 22.04 on purpose, not ubuntu-latest. A Flutter binary links against the
    # glibc it was built with and will not start on anything older, so building
    # on 24.04 would silently drop Debian 12 and Ubuntu 22.04 users. Building on
    # the older runner costs nothing and covers both.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: clients/sentinelle

    steps:
      - uses: actions/checkout@v4

      # libgtk-3-dev and the toolchain are Flutter's own requirements; the last
      # two belong to plugins — tray_manager needs appindicator for the system
      # tray, local_notifier needs libnotify for desktop notifications. Both
      # compile without them and then silently do nothing at runtime, which is
      # the failure worth avoiding here.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libnotify-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Versions
        run: |
          flutter --version
          cmake --version | head -1

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags e2e

      - name: Build
        run: flutter build linux --release

      - name: Package
        id: package
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          VERSION=${VERSION//+/-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          # What it was actually linked against. A build that quietly needs a
          # newer glibc than intended is invisible until someone cannot start it.
          ldd --version | head -1
          objdump -T "$BUNDLE/sentinelle" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3

          # Staged under a named directory so extracting it does not scatter
          # forty files across whatever folder the user happened to be in.
          STAGE="sentinelle-$VERSION-linux-x64"
          cp -R "$BUNDLE" "$STAGE"
          tar -czf "dist/$STAGE.tar.gz" "$STAGE"

          # ── .deb ──────────────────────────────────────────────────────────
          PKG=$(mktemp -d)
          install -d "$PKG/DEBIAN" "$PKG/opt/sentinelle" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -R "$BUNDLE/." "$PKG/opt/sentinelle/"
          cp linux/packaging/sentinelle.desktop "$PKG/usr/share/applications/"
          cp linux/packaging/sentinelle.png \
            "$PKG/usr/share/icons/hicolor/256x256/apps/"
          ln -s /opt/sentinelle/sentinelle "$PKG/usr/bin/sentinelle"

          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: sentinelle
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libayatana-appindicator3-1, libnotify4
          Maintainer: Sentinelle <noreply@users.noreply.github.com>
          Description: VPN client for the Sentinelle panel
           Connects through your own panel, a subscription URL, or pasted
           configs, using sing-box in proxy or full-tunnel mode.
          CONTROL

          dpkg-deb --build --root-owner-group "$PKG" \
            "dist/sentinelle_${VERSION}_amd64.deb"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sentinelle-linux-${{ steps.package.outputs.version }}
          path: clients/sentinelle/dist/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: clients/sentinelle/dist/*
          body: |
            Linux build of the Sentinelle client, x86-64.

            ```
            sudo apt install ./sentinelle_*_amd64.deb
            ```

            Or from the tarball, which runs from anywhere:

            ```
            tar -xzf sentinelle-*-linux-x64.tar.gz
            cd sentinelle-*-linux-x64 && ./sentinelle
            ```

            Proxy mode works as an ordinary user. VPN (TUN) mode creates a
            network device and needs root:

            ```
            sudo /opt/sentinelle/sentinelle
            ```
