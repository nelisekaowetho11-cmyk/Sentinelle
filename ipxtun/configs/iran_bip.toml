# IRAN side (server) - bare-IP tunnel
#
# Sized to run ALONGSIDE the existing backhaul tunnel, not instead of it, so you
# can compare the two before cutting over. Everything that could collide has
# been moved: tunnel subnet, health port, public listen ports and the IP
# protocol number. See "Cutting over" in the README for the values to restore
# once backhaul is switched off.
#
# Peer file: kharej_bip.toml. psk, ip_proto and mtu must match it exactly.

[transport]
type = "tun"
heartbeat_interval = 10
heartbeat_timeout = 25

[tun]
encapsulation = "ipx"
name = "ipx-bip"                # backhaul uses "backhaul-bip"
local_addr = "10.30.20.1/24"    # backhaul uses 10.20.20.1/24
remote_addr = "10.30.20.2/24"
health_port = 21235             # backhaul uses 1235
mtu = 1320

[ipx]
mode = "server"
profile = "bip"
listen_ip = "203.0.113.20"
dst_ip = "198.51.100.10"
interface = "eth0"
# IP protocol number on the wire. There is no port here at all.
# 253 is reserved for experimental use (RFC 3692), so it is unlikely to clash
# with whatever number backhaul picked. If this tunnel is ever blocked, try
# 4 (ipip), 47 (gre) or 94 - changing it on both ends together.
ip_proto = 253

[security]
enable_encryption = true
algorithm = "aes-256-gcm"
# PLACEHOLDER. Generate your own before starting the tunnel:
#     ipxtun -genpsk        (or: openssl rand -base64 32)
# Must match the peer config exactly, and differ from every other tunnel.
psk = "REPLACE-ME-run-openssl-rand-base64-32"
kdf_iterations = 100000
# Random padding bytes per packet to blur packet-size fingerprints.
# Costs a little bandwidth; set to 0 for maximum throughput.
padding = 0

[tuning]
auto_tuning = true
tuning_profile = "balanced"
workers = 0
channel_size = 4096
so_sndbuf = 0
so_rcvbuf = 0

[logging]
log_level = "info"

[ports]
# "native" proxies in-process and handles TCP *and* UDP.
# "iptables" uses netfilter DNAT instead (less CPU, no per-connection stats).
forwarder = "native"
# Listen ports are shifted by 10000 so they do not fight backhaul for the same
# public ports. The destination ports are unchanged, because those are the real
# services on the Kharej box.
mapping = [
    "18080=8081",
    "18040=8041",
    "18020=8021",
    "15001=5000",
]
