<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Bridge — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-ui: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --motion: 240ms cubic-bezier(.4,0,.2,1);
  --motion-fast: 140ms cubic-bezier(.4,0,.2,1);
  --accent: oklch(75% 0.13 175);
  --accent-hi: oklch(82% 0.14 175);
  --accent-lo: oklch(60% 0.13 175);
  --accent-tint: oklch(75% 0.13 175 / 0.12);
  --accent-soft: oklch(75% 0.13 175 / 0.20);
  --ring: oklch(75% 0.13 175 / 0.40);
  --warn: oklch(78% 0.16 75);
  --danger: oklch(68% 0.20 25);
  --danger-tint: oklch(68% 0.20 25 / 0.15);
}
:root, [data-theme="dark"] {
  --bg: #0a0c10;
  --bg-grad: radial-gradient(1200px 700px at 80% -10%, oklch(75% 0.13 175 / 0.07), transparent 60%),
             radial-gradient(900px 500px at -10% 110%, oklch(72% 0.13 240 / 0.05), transparent 60%);
  --surface: #12161d;
  --surface-2: #161b23;
  --border: #232a35;
  --border-soft: #1c222b;
  --text: #e8ebef;
  --text-2: #b6bcc7;
  --muted: #7c828d;
  --chip-bg: #1a2029;
}
[data-theme="light"] {
  --bg: #f7f5f0;
  --bg-grad: radial-gradient(1100px 600px at 85% -10%, oklch(75% 0.13 175 / 0.10), transparent 65%),
             radial-gradient(800px 400px at -10% 110%, oklch(72% 0.13 240 / 0.08), transparent 60%);
  --surface: #ffffff;
  --surface-2: #fbfaf7;
  --border: #e6e3dc;
  --border-soft: #efece5;
  --text: #15181d;
  --text-2: #3a3f47;
  --muted: #6b6f78;
  --chip-bg: #f1efe9;
  --accent: oklch(60% 0.13 175);
  --accent-hi: oklch(65% 0.14 175);
  --accent-tint: oklch(60% 0.13 175 / 0.10);
  --accent-soft: oklch(60% 0.13 175 / 0.18);
  --ring: oklch(60% 0.13 175 / 0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font-ui);font-size:14px;color:var(--text);
  background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  display:grid;place-items:center;min-height:100vh;
  transition:background-color var(--motion),color var(--motion);
}
.card{
  width:100%;max-width:400px;margin:1.5rem;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:0 20px 60px -10px rgba(0,0,0,0.4);
  overflow:hidden;
}
.card-head{
  padding:32px 28px 24px;text-align:center;
  border-bottom:1px solid var(--border-soft);
}
.brand-mark{
  width:48px;height:48px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-lo));
  display:grid;place-items:center;color:#0a0c10;
  box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px var(--accent-soft);
  margin:0 auto 14px;position:relative;overflow:hidden;
}
.brand-mark::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.18),transparent 60%);}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;margin-bottom:4px;}
.brand-sub{color:var(--muted);font-size:13px;}
.card-body{padding:28px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--text-2);}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap svg.ico{position:absolute;left:11px;color:var(--muted);pointer-events:none;width:15px;height:15px;}
.input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-md);padding:10px 11px 10px 36px;
  color:var(--text);font-family:var(--font-ui);font-size:13.5px;outline:none;
  transition:border-color var(--motion-fast),box-shadow var(--motion-fast);
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
.input::placeholder{color:var(--muted);}
.btn-toggle-pw{
  position:absolute;right:10px;background:none;border:none;cursor:pointer;
  color:var(--muted);display:flex;align-items:center;padding:2px;
  transition:color var(--motion-fast);
}
.btn-toggle-pw:hover{color:var(--text);}
.btn-primary{
  width:100%;padding:11px;border-radius:var(--r-md);cursor:pointer;
  background:var(--accent);color:#07120e;border:1px solid var(--accent-hi);
  font-family:var(--font-ui);font-weight:600;font-size:14px;
  box-shadow:0 6px 20px var(--accent-soft);
  transition:all var(--motion-fast);display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:hover{background:var(--accent-hi);transform:translateY(-1px);}
.btn-primary:active{transform:scale(.98);}
.alert{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:var(--r-md);
  font-size:13px;margin-bottom:16px;
  background:var(--danger-tint);color:var(--danger);
  border:1px solid oklch(68% 0.20 25 / 0.3);
}
.alert svg{flex-shrink:0;}
.theme-btn{
  position:fixed;bottom:20px;right:20px;
  width:40px;height:40px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;cursor:pointer;color:var(--text-2);
  transition:all var(--motion-fast);box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.theme-btn:hover{color:var(--text);transform:translateY(-1px);}
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor" fill-opacity="0.15"/>
        <path d="M9 12l2 2 4-5"/>
      </svg>
    </div>
    <div class="brand-name">Bridge</div>
    <div class="brand-sub">VPN Control Panel</div>
  </div>
  <div class="card-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}
    <form method="POST" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="input" type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus/>
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:38px"/>
          <button type="button" class="btn-toggle-pw" id="pw-toggle" tabindex="-1">
            <svg id="pw-eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign in
      </button>
    </form>
  </div>
</div>

<button class="theme-btn" id="theme-btn" title="Toggle theme">
  <svg id="t-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2M20 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"/></svg>
  <svg id="t-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<script>
(function(){
  const saved = localStorage.getItem('bridge-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('t-sun').style.display  = saved === 'dark'  ? '' : 'none';
  document.getElementById('t-moon').style.display = saved === 'light' ? '' : 'none';
})();

document.getElementById('theme-btn').addEventListener('click', function(){
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('bridge-theme', next);
  document.getElementById('t-sun').style.display  = next === 'dark'  ? '' : 'none';
  document.getElementById('t-moon').style.display = next === 'light' ? '' : 'none';
});

document.getElementById('pw-toggle').addEventListener('click', function(){
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
</script>
</body>
</html>
